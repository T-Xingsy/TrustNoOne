openapi: 3.0.3
info:
  title: NFT Promise Verification API
  description: |
    NFT 项目承诺验证系统 API 规范
    
    本 API 提供以下核心功能：
    - 项目管理（创建、查询、更新）
    - 承诺收集和验证
    - 验证报告生成和查询
    - 历史记录追踪
  version: 1.0.0
  contact:
    name: Promise Breaker Team
    email: support@promisebreaker.io

servers:
  - url: http://localhost:8000/api/v1
    description: 本地开发环境
  - url: https://api.promisebreaker.io/v1
    description: 生产环境

tags:
  - name: Projects
    description: NFT 项目管理
  - name: Promises
    description: 承诺管理
  - name: Verification
    description: 验证和报告
  - name: History
    description: 历史记录

paths:
  /projects:
    post:
      tags:
        - Projects
      summary: 创建新项目
      description: 创建一个新的 NFT 项目，并返回项目 ID
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 项目创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Projects
      summary: 获取项目列表
      description: 分页获取所有项目列表
      operationId: listProjects
      parameters:
        - name: page
          in: query
          description: 页码（从 1 开始）
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: page_size
          in: query
          description: 每页数量
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort_by
          in: query
          description: 排序字段
          schema:
            type: string
            enum: [created_at, last_verified_at, name]
            default: created_at
        - name: order
          in: query
          description: 排序顺序
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: 成功返回项目列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'

  /projects/{project_id}:
    get:
      tags:
        - Projects
      summary: 获取项目详情
      description: 根据项目 ID 获取项目详细信息
      operationId: getProject
      parameters:
        - name: project_id
          in: path
          required: true
          description: 项目 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功返回项目详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Projects
      summary: 更新项目信息
      description: 更新项目的基本信息（不包括验证数据）
      operationId: updateProject
      parameters:
        - name: project_id
          in: path
          required: true
          description: 项目 ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 项目更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{project_id}/verify:
    post:
      tags:
        - Verification
      summary: 启动项目验证
      description: |
        启动一个完整的项目验证流程，包括：
        1. 收集项目承诺（Twitter、官网、白皮书）
        2. 查询链上数据
        3. 计算五维评分和画饼指数
        4. 生成验证报告
        5. 隐私存储结果
        
        **注意**: 此操作可能需要 5-10 分钟完成
      operationId: verifyProject
      parameters:
        - name: project_id
          in: path
          required: true
          description: 项目 ID
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: 验证任务已接受，正在处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationTaskResponse'
        '404':
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 项目正在验证中，请稍后再试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{project_id}/promises:
    get:
      tags:
        - Promises
      summary: 获取项目承诺列表
      description: 获取项目的所有承诺数据
      operationId: getProjectPromises
      parameters:
        - name: project_id
          in: path
          required: true
          description: 项目 ID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: 按验证状态筛选
          schema:
            type: string
            enum: [pending, fulfilled, unfulfilled, unverifiable]
        - name: type
          in: query
          description: 按承诺类型筛选
          schema:
            type: string
            enum: [airdrop, feature_development, partnership, community_event, nft_minting, marketplace_launch, other]
      responses:
        '200':
          description: 成功返回承诺列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromiseListResponse'
        '404':
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{project_id}/reports:
    get:
      tags:
        - Verification
      summary: 获取项目验证报告列表
      description: 获取项目的所有历史验证报告
      operationId: getProjectReports
      parameters:
        - name: project_id
          in: path
          required: true
          description: 项目 ID
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: 返回数量限制
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 成功返回报告列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '404':
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{project_id}/reports/latest:
    get:
      tags:
        - Verification
      summary: 获取最新验证报告
      description: 获取项目的最新一次验证报告
      operationId: getLatestReport
      parameters:
        - name: project_id
          in: path
          required: true
          description: 项目 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功返回最新报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReportResponse'
        '404':
          description: 项目不存在或无验证记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reports/{report_id}:
    get:
      tags:
        - Verification
      summary: 获取验证报告详情
      description: 根据报告 ID 获取完整的验证报告
      operationId: getReport
      parameters:
        - name: report_id
          in: path
          required: true
          description: 报告 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功返回报告详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReportResponse'
        '404':
          description: 报告不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reports/{report_id}/export:
    get:
      tags:
        - Verification
      summary: 导出验证报告
      description: 导出验证报告为 PDF 或 JSON 格式
      operationId: exportReport
      parameters:
        - name: report_id
          in: path
          required: true
          description: 报告 ID
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          description: 导出格式
          schema:
            type: string
            enum: [pdf, json]
            default: pdf
      responses:
        '200':
          description: 成功导出报告
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReportResponse'
        '404':
          description: 报告不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{task_id}:
    get:
      tags:
        - Verification
      summary: 查询验证任务状态
      description: 查询异步验证任务的执行状态
      operationId: getTaskStatus
      parameters:
        - name: task_id
          in: path
          required: true
          description: 任务 ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ��功返回任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'
        '404':
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 项目名称
          example: "Bored Ape Yacht Club"
        twitter_account:
          type: string
          description: Twitter 账号
          example: "@BoredApeYC"
        website_url:
          type: string
          format: uri
          description: 官网 URL
          example: "https://boredapeyachtclub.com"
        whitepaper_url:
          type: string
          format: uri
          description: 白皮书链接
          example: "https://boredapeyachtclub.com/whitepaper.pdf"
        contract_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: 智能合约地址
          example: "0xBC4CA0EdA7647A8aB7C2061c2E118A18a936f13D"
        github_repo:
          type: string
          description: GitHub 仓库
          example: "BoredApeYC/bayc-contracts"
        treasury_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: 国库地址
          example: "0x1234567890123456789012345678901234567890"

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        twitter_account:
          type: string
        website_url:
          type: string
          format: uri
        whitepaper_url:
          type: string
          format: uri
        contract_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        github_repo:
          type: string
        treasury_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'

    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        twitter_account:
          type: string
          nullable: true
        website_url:
          type: string
          format: uri
          nullable: true
        whitepaper_url:
          type: string
          format: uri
          nullable: true
        contract_address:
          type: string
          nullable: true
        github_repo:
          type: string
          nullable: true
        treasury_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_verified_at:
          type: string
          format: date-time
          nullable: true
        latest_promise_breaking_index:
          type: number
          format: float
          nullable: true
          description: 最新画饼指数

    ProjectListResponse:
      type: object
      properties:
        total:
          type: integer
          description: 总数量
        page:
          type: integer
          description: 当前页码
        page_size:
          type: integer
          description: 每页数量
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'

    PromiseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        content:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [twitter, website, whitepaper]
              url:
                type: string
                format: uri
              published_at:
                type: string
                format: date-time
        promise_type:
          type: string
          enum: [airdrop, feature_development, partnership, community_event, nft_minting, marketplace_launch, other]
        target_date:
          type: string
          format: date
          nullable: true
        verification_status:
          type: string
          enum: [pending, fulfilled, unfulfilled, unverifiable]
        importance_weight:
          type: number
          format: float
        created_at:
          type: string
          format: date-time

    PromiseListResponse:
      type: object
      properties:
        total:
          type: integer
        promises:
          type: array
          items:
            $ref: '#/components/schemas/PromiseResponse'

    VerificationReportResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        verification_time:
          type: string
          format: date-time
        promise_breaking_index:
          type: number
          format: float
          description: 画饼指数 (0-100)
        five_dimensions:
          type: object
          properties:
            integrity:
              type: object
              properties:
                score:
                  type: number
                  format: float
                weight:
                  type: number
                  format: float
                  example: 0.30
                details:
                  type: string
            fairness:
              type: object
              properties:
                score:
                  type: number
                  format: float
                weight:
                  type: number
                  format: float
                  example: 0.25
                details:
                  type: string
            activity:
              type: object
              properties:
                score:
                  type: number
                  format: float
                weight:
                  type: number
                  format: float
                  example: 0.20
                details:
                  type: string
            stability:
              type: object
              properties:
                score:
                  type: number
                  format: float
                weight:
                  type: number
                  format: float
                  example: 0.15
                details:
                  type: string
            momentum:
              type: object
              properties:
                score:
                  type: number
                  format: float
                weight:
                  type: number
                  format: float
                  example: 0.10
                details:
                  type: string
        statistics:
          type: object
          properties:
            total_promises:
              type: integer
            fulfilled_count:
              type: integer
            unfulfilled_count:
              type: integer
            unverifiable_count:
              type: integer
        summary:
          type: string
          description: 报告摘要
        recommendations:
          type: array
          items:
            type: string
          description: 建议列表

    ReportListResponse:
      type: object
      properties:
        total:
          type: integer
        reports:
          type: array
          items:
            $ref: '#/components/schemas/VerificationReportResponse'

    VerificationTaskResponse:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
        created_at:
          type: string
          format: date-time
        estimated_completion_time:
          type: string
          format: date-time
          description: 预计完成时间

    TaskStatusResponse:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 进度百分比
        current_step:
          type: string
          description: 当前执行步骤
        result:
          type: object
          nullable: true
          description: 任务结果（仅在 completed 状态时返回）
        error:
          type: string
          nullable: true
          description: 错误信息（仅在 failed 状态时返回）

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: 错误类型
        message:
          type: string
          description: 错误详细信息
        details:
          type: object
          nullable: true
          description: 额外错误详情
